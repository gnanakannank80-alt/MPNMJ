      }
      .summary-box-inner {

        justify-content: center;
        text-align: center;
      }
      .summary-item b {

      }
      .summary-item small {

        font-size: 0.75rem;
      }

        margin-bottom: 12px;

        display: grid;

      }

        padding: 10px 5px;
        border: 2px solid var(--border);
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        background: var(--card-bg);
        color: var(--text-main);
      }
      .period-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }
      .period-btn.assigned {
        border-color: var(--secondary);
        color: var(--secondary);
      }
      .period-btn.blocked {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .role-link {
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        background: transparent;
        border: 2px solid var(--primary);
        color: var(--text-main);
        padding: 20px 10px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;

      // ═══════════════════════════════════════
      function safeKey(s) {
        return String(s).replace(/[.#$\/\[\]\s]/g, "_");
      }

        return new Date().toISOString().split("T")[0];
      }

      // ═══════════════════════════════════════
      function applyTheme() {
        if (localStorage.getItem("theme") === "dark") {
          document.body.setAttribute("data-theme", "dark");
          let t = document.getElementById("themeToggle");
          if (t) t.checked = true;
        }
      }
      function toggleTheme() {
        let isDark = document.getElementById("themeToggle").checked;
        if (isDark) {
          document.body.setAttribute("data-theme", "dark");
          localStorage.setItem("theme", "dark");
        } else {
          document.body.removeAttribute("data-theme");
          localStorage.setItem("theme", "light");
        }
      }

        e.preventDefault();
        deferredPrompt = e;
        setTimeout(() => {
          if (deferredPrompt)
            document.getElementById("installBanner").style.display = "block";
        }, 5000);
      });
      window.addEventListener("appinstalled", () => {
        document.getElementById("installBanner").style.display = "none";
        deferredPrompt = null;
      });

        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => {

        document.getElementById("loginRoleTitle").innerText = role + " Login";
        document.getElementById("loginLabel").innerText =
          role === "Student" ? "Register Number" : "Username";
        document.getElementById("txtUser").placeholder =
          role === "Student" ? "Enter Register Number" : "Enter Username";
        document.getElementById("txtUser").value = "";
        document.getElementById("txtPass").value = "";
        document.getElementById("loginError").style.display = "none";
        document.getElementById("loginFormCard").classList.remove("hidden");
      }
      function hideLoginForm() {
        document.getElementById("loginFormCard").classList.add("hidden");
      }

      function doLogin() {
        let user = document
          .getElementById("txtUser")
          .value.trim()
          .toLowerCase();
        let pass = document.getElementById("txtPass").value.trim();
        let err = document.getElementById("loginError");
        err.style.display = "none";
        if (!user || !pass) {
          err.innerText = "Please fill all fields";
          err.style.display = "block";
          return;
        }

        let valid = false,
          foundName = user,
          foundYear = "";

        if (currentRole === "Student") {
          if (pass === CREDENTIALS.student.pass) {
            for (let yr in STUDENTS) {
              let s = STUDENTS[yr].find((x) => x.id === user);
              if (s) {
                valid = true;
                foundName = s.name;
                foundYear = yr;
                break;
              }
            }
          }
        } else if (currentRole === "Staff") {
          let staff = STAFF_LIST.find((x) => x.login === user);
          if (staff && pass === CREDENTIALS.staff.pass) {
            valid = true;
            foundName = staff.display;
          }
        } else if (currentRole === "HOD") {
          if (user === CREDENTIALS.hod.user && pass === CREDENTIALS.hod.pass) {
            valid = true;
            foundName = "K. N. SIVAKUMAR";
          }
        } else if (currentRole === "Principal") {
          if (
            user === CREDENTIALS.principal.user &&
            pass === CREDENTIALS.principal.pass
          ) {
            valid = true;
            foundName = "DR. RAMESH";
          }
        }

        if (valid) {
          state = {
            userRole: currentRole,
            userId: user,
            userName: foundName,
            userYear: foundYear,
            email: "",
          };
          localStorage.setItem("mpnmjec_user", JSON.stringify(state));
          loadApp();
        } else {
          err.innerText = "Invalid credentials";
          err.style.display = "block";
        }
      }

      function doLogout() {
        if (confirm("Logout?")) {
          localStorage.removeItem("mpnmjec_user");
          location.reload();
        }
      }

      // ═══════════════════════════════════════
      // APP LOAD
      // ═══════════════════════════════════════
      function loadApp() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainApp").classList.remove("hidden");
        document.getElementById("headerUser").innerText =
          `${state.userName} (${state.userRole})`;
        applyTheme();
        switchTab("Home");
        renderSettings();
      }

      function switchTab(tab) {
        ["Home", "Report", "Settings"].forEach((t) => {
          document.getElementById("view" + t).classList.add("hidden");
          document.getElementById("nav" + t).classList.remove("active");
        });
        document.getElementById("view" + tab).classList.remove("hidden");
        document.getElementById("nav" + tab).classList.add("active");
        if (tab === "Home") renderDashboard();
        if (tab === "Report") renderReportTab();
        if (tab === "Settings") renderSettings();
      }

      function studentDash() {
        document.getElementById("viewHome").innerHTML = `
    <div class="card mb-3 text-center">

      <p>${state.userId} | ${state.userYear} | CSE</p>
    </div>
    <h3 class="mb-3">My Dashboard</h3>
    <div class="action-grid">

      <div class="action-card" onclick="viewTimetable('${state.userYear}')"><i class="fa-solid fa-calendar-days"></i><span>Time Table</span></div>
      <div class="action-card" onclick="studentMarks(1)"><i class="fa-solid fa-file-pen"></i><span>IAT-1</span></div>
      <div class="action-card" onclick="studentMarks(2)"><i class="fa-solid fa-file-pen"></i><span>IAT-2</span></div>
    </div>`;

      function studentAttendance() {
        openModal(
          "My Attendance",
          "<p>Loading... <i class='fa-solid fa-spinner fa-spin'></i></p>",
        );
        let ck = safeKey(state.userYear);
        db.ref("attendance")
          .once("value")
          .then((snap) => {
            let abDates = [],
              odDates = [],
              total = 0;
            if (snap.exists()) {
              Object.keys(snap.val()).forEach((dk) => {
                let dd = snap.val()[dk];
                if (dd[ck]) {
                  total++;
                  let fa = false,
                    fo = false;
                  Object.values(dd[ck]).forEach((pd) => {
                    if (pd[state.userId]) {
                      if (pd[state.userId].status === "Absent") fa = true;
                      if (pd[state.userId].status === "OD") fo = true;
                    }
                  });
                  let disp = dk.replace(/_/g, "-");
                  if (fa) abDates.push(disp);
                  else if (fo) odDates.push(disp);
                }
              });
            }
            if (total === 0) total = 90;
            let attended = total - abDates.length;
            let perc = Math.round((attended / total) * 100);
            let col = perc >= 75 ? "green-color" : "red-color";
            let abH =
              abDates.length > 0
                ? abDates
                    .map(
                      (d) =>
                        `<span class="badge bg-absent" style="margin:2px">${d}</span>`,
                    )
                    .join(" ")
                : `<span class="text-muted">No Absent Days</span>`;
            let odH =
              odDates.length > 0
                ? odDates
                    .map(
                      (d) =>
                        `<span class="badge bg-od" style="margin:2px">${d}</span>`,
                    )
                    .join(" ")
                : `<span class="text-muted">No OD Days</span>`;
            document.getElementById("modalTitle").innerText = "My Attendance";
            document.getElementById("modalBody").innerHTML = `
      <div class="progress-container">
        <svg viewBox="0 0 36 36" class="circular-chart ${col}">
          <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <path class="circle" stroke-dasharray="${perc},100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <text x="18" y="20.35" class="percentage">${perc}%</text>
        </svg>
        <p style="text-align:center">Total Days Recorded: ${total}</p>
      </div>
      <div class="summary-box"><div class="summary-box-inner">
        <div class="summary-item"><b style="color:var(--secondary)">${attended}</b><small>Present</small></div>
        <div class="summary-item"><b style="color:var(--error)">${abDates.length}</b><small>Absent</small></div>
        <div class="summary-item"><b style="color:#f59e0b">${odDates.length}</b><small>OD</small></div>
      </div></div>
      <hr style="border-color:var(--border);margin:12px 0">
      <h4>Absent Dates</h4><div style="margin:8px 0 12px">${abH}</div>
      <h4>On Duty Dates</h4><div style="margin:8px 0">${odH}</div>`;
          })
          .catch(() => {
            document.getElementById("modalBody").innerHTML =
              "<p>Error loading.</p>";
          });
      }

      function studentMarks(iatNum) {
        openModal(
          `IAT-${iatNum} Results`,
          "<p>Loading... <i class='fa-solid fa-spinner fa-spin'></i></p>",
        );
        let key = safeKey(`iat_${iatNum}_${state.userYear}`);
        db.ref(`iat_marks/${key}`)
          .once("value")
          .then((snap) => {
            let marks = [];
            if (snap.exists())
              Object.values(snap.val()).forEach((sd) =>
                Object.values(sd).forEach((r) => marks.push(r)),
              );
            let sm = marks.filter((m) => m.id === state.userId);
            let rows =
              sm.length === 0
                ? `<tr><td colspan="5" class="text-center">Results not published yet.</td></tr>`
                : sm
                    .map((m) => {
                      let tot = parseInt(m.internal) + parseInt(m.exam);
                      return `<tr><td>${m.subjName}<br><small>${m.subjCode}</small></td><td>${m.internal}</td><td>${m.exam}</td><td>${tot}</td><td><span class="badge ${m.exam >= 30 && tot >= 70 ? "bg-present" : "bg-absent"}">${m.exam >= 30 && tot >= 70 ? "PASS" : "FAIL"}</span></td></tr>`;
                    })
                    .join("");
            document.getElementById("modalTitle").innerText =
              `IAT-${iatNum} Results`;
            document.getElementById("modalBody").innerHTML = `
      <div class="table-responsive"><table><thead><tr><th>Subject</th><th>Internal</th><th>Exam</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${sm.length > 0 ? `<button class="btn-pdf mt-3" onclick="pdfStudentIAT(${iatNum},'${state.userYear}','${state.userId}','${state.userName}')"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>` : ""}`;
          })
          .catch(() => {
            document.getElementById("modalBody").innerHTML =
              "<p>Error loading.</p>";
          });
      }

      function staffDash() {
        document.getElementById("viewHome").innerHTML = `
    <div class="card mb-3"><h2>Staff Dashboard</h2><p>Welcome, ${state.userName}</p></div>
    <div class="action-grid">

      // ── Staff: Take Attendance ──
      function staffTakeAttendance() {
        openModal(
          "Take Attendance",
          `
    <div class="form-group"><label>Select Year</label>
      <select id="atYr" class="form-control" onchange="loadSubjectAssignments()">${yearOpts()}</select>
    </div>
    <div class="form-group"><label>Select Period</label>
      <select id="atPeriod" class="form-control" onchange="checkStaffAssignment()">${periodOpts()}</select>

    <div id="assignmentInfo"></div>

      function loadSubjectAssignments() {
        let yr = document.getElementById("atYr").value;
        checkStaffAssignment();
      }

      function checkStaffAssignment() {
        let yr = document.getElementById("atYr")?.value;
        let period = document.getElementById("atPeriod")?.value;
        if (!yr || !period) return;
        let infoEl = document.getElementById("assignmentInfo");
        let listEl = document.getElementById("studentListArea");
        infoEl.innerHTML =
          "<p>Checking assignment... <i class='fa-solid fa-spinner fa-spin'></i></p>";
        listEl.innerHTML = "";
        db.ref(`subject_staff/${safeKey(yr)}/${period}`)
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              infoEl.innerHTML = `<div class="info-box error"><i class="fa-solid fa-triangle-exclamation"></i> No subject assigned for ${yr} - ${period}. Contact HOD.</div>`;
              return;
            }
            let a = snap.val();
            if (a.staffLogin !== state.userId) {
              infoEl.innerHTML = `<div class="info-box error"><i class="fa-solid fa-lock"></i> You are not assigned to ${yr} - ${period}. Assigned staff: <b>${a.staffName}</b></div>`;
              return;
            }
            infoEl.innerHTML = `<div class="info-box success"><i class="fa-solid fa-check-circle"></i> Assigned: <b>${a.subjCode} - ${a.subjName}</b> | ${yr} - ${period}</div>`;
            loadStudentListForAttendance(yr, period, a);
          })
          .catch(() => {
            infoEl.innerHTML = `<div class="info-box error">Error checking assignment.</div>`;
          });
      }

      function loadStudentListForAttendance(yr, period, assignment) {
        let list = STUDENTS[yr];
        let dateStr = today();
        db.ref(`attendance/${dateKey(dateStr)}/${safeKey(yr)}/${period}`)
          .once("value")
          .then((snap) => {
            let existing = snap.exists() ? snap.val() : {};
            let html = `<h5 style="margin:10px 0">${yr} - ${period} | ${dateStr}</h5>
      <div class="table-responsive"><table><thead><tr><th>ID</th><th>Name</th><th>Status</th></tr></thead><tbody>`;
            list.forEach((s) => {
              let cur = existing[s.id] ? existing[s.id].status : "Present";
              html += `<tr>
        <td style="font-size:0.75rem">${s.id}</td>
        <td style="font-size:0.8rem">${s.name}</td>
        <td><select class="form-control table-input attn-sel" data-id="${s.id}" data-name="${s.name}" style="width:90px;font-size:0.8rem" onchange="updateAttnCount()">
          <option value="Present" ${cur === "Present" ? "selected" : ""}>Present</option>
          <option value="Absent" ${cur === "Absent" ? "selected" : ""}>Absent</option>
          <option value="OD" ${cur === "OD" ? "selected" : ""}>OD</option>
        </select></td></tr>`;
            });
            html += `</tbody></table></div>
      <div class="summary-box" id="attnSumBox"><div class="summary-box-inner">
        <div class="summary-item"><b>${list.length}</b><small>Total</small></div>
        <div class="summary-item"><b style="color:var(--secondary)" id="cntP">${list.length}</b><small>Present</small></div>
        <div class="summary-item"><b style="color:var(--error)" id="cntA">0</b><small>Absent</small></div>
        <div class="summary-item"><b style="color:#f59e0b" id="cntO">0</b><small>OD</small></div>
      </div></div>
      <button class="btn mt-1" onclick="submitAttendance('${yr}','${period}','${assignment.subjCode}','${assignment.subjName}')">Submit Attendance</button>`;
            document.getElementById("studentListArea").innerHTML = html;
          });
      }

      function updateAttnCount() {
        let sels = document.querySelectorAll(".attn-sel");
        let p = 0,
          a = 0,
          o = 0;
        sels.forEach((s) => {
          if (s.value === "Present") p++;
          else if (s.value === "Absent") a++;
          else o++;
        });
        let ep = document.getElementById("cntP"),
          ea = document.getElementById("cntA"),
          eo = document.getElementById("cntO");
        if (ep) ep.innerText = p;
        if (ea) ea.innerText = a;
        if (eo) eo.innerText = o;
      }

      function submitAttendance(yr, period, subjCode, subjName) {
        let sels = document.querySelectorAll(".attn-sel");
        let d = today();
        let updates = {};
        sels.forEach((sel) => {
          let id = sel.getAttribute("data-id");
          let name = sel.getAttribute("data-name");
          updates[`attendance/${dateKey(d)}/${safeKey(yr)}/${period}/${id}`] = {
            id,
            name,
            class: yr,
            status: sel.value,
            period,
            date: d,
            subjCode,
            subjName,
            staffLogin: state.userId,
            staffName: state.userName,
          };
        });
        db.ref()
          .update(updates)
          .then(() => {
            alert("Attendance Submitted!");
            closeModal();
          })
          .catch((e) => alert("Error: " + e.message));
      }

      // ── Staff: Attendance Report ──
      function staffAttendanceReport() {
        let curMonth = new Date().getMonth();
        openModal(
          "Attendance Report",
          `
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
      <div class="form-group" style="flex:1;min-width:120px;margin:0">
        <label>Month</label>
        <select id="arMonth" class="form-control" onchange="loadStaffAttnReport()">${monthOpts(curMonth)}</select>
      </div>
      <div class="form-group" style="flex:1;min-width:120px;margin:0">
        <label>Year</label>
        <select id="arYear" class="form-control" onchange="loadStaffAttnReport()">${yearOpts()}</select>
      </div>
    </div>
    <div id="arContent"><p>Loading... <i class='fa-solid fa-spinner fa-spin'></i></p></div>`,
        );
        loadStaffAttnReport();
      }

      function loadStaffAttnReport() {
        let monthIdx = parseInt(document.getElementById("arMonth").value);
        let yr = document.getElementById("arYear").value;
        let el = document.getElementById("arContent");
        el.innerHTML = "<p>Loading...</p>";
        db.ref("attendance")
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              el.innerHTML = "<p>No attendance data found.</p>";
              return;
            }
            let rows = [];
            let data = snap.val();
            Object.keys(data)
              .sort()
              .forEach((dk) => {
                let dateStr = dk.replace(/_/g, "-");
                let parts = dateStr.split("-");
                if (parts.length < 2) return;
                let dMonth = parseInt(parts[1]) - 1;
                if (dMonth !== monthIdx) return;
                let classData = data[dk][safeKey(yr)];
                if (!classData) return;
                Object.keys(classData).forEach((period) => {
                  let periodData = classData[period];
                  let hasStaff = Object.values(periodData).some(
                    (r) => r.staffLogin === state.userId,
                  );
                  if (!hasStaff) return;
                  let p = 0,
                    a = 0,
                    o = 0;
                  Object.values(periodData).forEach((r) => {
                    if (r.status === "Present") p++;
                    else if (r.status === "Absent") a++;
                    else o++;
                  });
                  let subjCode = "",
                    subjName = "";
                  let first = Object.values(periodData)[0];
                  if (first) {
                    subjCode = first.subjCode || "";
                    subjName = first.subjName || "";
                  }
                  rows.push({
                    date: dateStr,
                    period,
                    yr,
                    subjCode,
                    subjName,
                    p,
                    a,
                    o,
                  });
                });
              });
            if (rows.length === 0) {
              el.innerHTML = `<p>No attendance records found for ${MONTHS[monthIdx]} - ${yr}.</p>`;
              return;
            }
            let totalP = rows.reduce((s, r) => s + r.p, 0);
            let totalA = rows.reduce((s, r) => s + r.a, 0);
            let totalO = rows.reduce((s, r) => s + r.o, 0);
            let html = `<div class="table-responsive"><table>
      <thead><tr><th>Date</th><th>Period</th><th>Subject</th><th>Present</th><th>Absent</th><th>OD</th></tr></thead>
      <tbody>
      ${rows.map((r) => `<tr><td>${r.date}</td><td>${r.period}</td><td style="font-size:0.8rem">${r.subjCode}<br><small>${r.subjName}</small></td><td style="color:var(--secondary)">${r.p}</td><td style="color:var(--error)">${r.a}</td><td style="color:#f59e0b">${r.o}</td></tr>`).join("")}
      <tr style="font-weight:700;background:var(--bg-color)"><td colspan="3">Total</td><td style="color:var(--secondary)">${totalP}</td><td style="color:var(--error)">${totalA}</td><td style="color:#f59e0b">${totalO}</td></tr>
      </tbody></table></div>
      <button class="btn-pdf" onclick="pdfStaffAttnReport(${monthIdx},'${yr}')"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>`;
            el.innerHTML = html;
          })
          .catch(() => {
            el.innerHTML = "<p>Error loading.</p>";
          });
      }

      // ── Staff: IAT ──
      function staffIAT(num) {
        openModal(
          `Enter IAT-${num}`,
          `
    <div class="form-group"><label>Year</label><select id="iYr" class="form-control">${yearOpts()}</select></div>
    <div class="form-group"><label>Subject Code</label><input type="text" id="iCode" class="form-control" placeholder="e.g. CS3401"></div>
    <div class="form-group"><label>Subject Name</label><input type="text" id="iSubj" class="form-control" placeholder="e.g. Algorithms"></div>
    <div class="form-group"><label>Staff Name</label><select id="iStaff" class="form-control">${staffOpts(state.userId)}</select></div>
    <button class="btn mb-3" onclick="fetchIATList(${num})">Fetch Student List</button>
    <div id="iatListArea"></div>`,
        );
      }

      function fetchIATList(num) {
        let yr = document.getElementById("iYr").value;
        let code = document.getElementById("iCode").value.trim();
        let subj = document.getElementById("iSubj").value.trim();
        let stf = document.getElementById("iStaff").value;
        if (!code || !subj) {
          alert("Fill subject details");
          return;
        }
        document.getElementById("iatListArea").innerHTML = "<p>Loading...</p>";
        db.ref(`iat_marks/${safeKey(`iat_${num}_${yr}`)}/${safeKey(code)}`)
          .once("value")
          .then((snap) => {
            let ex = snap.exists() ? snap.val() : {};
            let list = STUDENTS[yr];
            let html = `<div class="table-responsive"><table><thead><tr><th>ID/Name</th><th>Internal<br>(40)</th><th>Exam<br>(60)</th><th>Total</th></tr></thead><tbody>`;
            list.forEach((s) => {
              let r = ex[s.id] || { internal: 40, exam: "" };
              let tot =
                r.exam !== ""
                  ? parseInt(r.internal) + parseInt(r.exam)
                  : r.internal;
              html += `<tr>
        <td style="font-size:0.75rem">${s.id}<br>${s.name}</td>
        <td><input type="number" id="int_${s.id}" class="form-control table-input" value="${r.internal}" style="width:55px" oninput="calcIATTotal('${s.id}')"></td>
        <td><input type="number" id="ex_${s.id}" class="form-control table-input" placeholder="/60" value="${r.exam}" style="width:55px" oninput="calcIATTotal('${s.id}')"></td>
        <td id="tot_${s.id}" style="font-weight:700;text-align:center;font-size:1rem">${tot}</td></tr>`;
            });
            html += `</tbody></table></div>
      <div class="summary-box"><div class="summary-box-inner">
        <div class="summary-item"><b>${list.length}</b><small>Total</small></div>
        <div class="summary-item"><b style="color:var(--secondary)" id="iatP">0</b><small>Pass</small></div>
        <div class="summary-item"><b style="color:var(--error)" id="iatF">${list.length}</b><small>Fail</small></div>
      </div></div>
      <button class="btn mt-1" onclick="submitIAT(${num},'${yr}','${code}','${subj}','${stf}')">Submit Marks</button>
      <button class="btn-pdf" onclick="pdfSubjectReport(${num},'${yr}','${code}','${subj}','${stf}')"><i class="fa-solid fa-file-pdf"></i> Download Subject Report</button>`;
            document.getElementById("iatListArea").innerHTML = html;
            list.forEach((s) => calcIATTotal(s.id));
          });
      }

      function calcIATTotal(id) {
        let iv = parseInt(document.getElementById(`int_${id}`)?.value) || 0;
        let ev = parseInt(document.getElementById(`ex_${id}`)?.value) || 0;
        let tot = iv + ev;
        let el = document.getElementById(`tot_${id}`);
        if (el) {
          el.innerText = tot;
          el.style.color =
            tot >= 70 && ev >= 30 ? "var(--secondary)" : "var(--error)";
        }
        let p = 0,
          f = 0;
        document.querySelectorAll("[id^='ex_']").forEach((inp) => {
          let sid = inp.id.replace("ex_", "");
          let i2 = parseInt(document.getElementById(`int_${sid}`)?.value) || 0;
          let e2 = parseInt(inp.value) || 0;
          if (i2 + e2 >= 70 && e2 >= 30) p++;
          else f++;
        });
        let ep = document.getElementById("iatP"),
          ef = document.getElementById("iatF");
        if (ep) ep.innerText = p;
        if (ef) ef.innerText = f;
      }

      function submitIAT(num, yr, code, subj, stf) {
        let list = STUDENTS[yr];
        let updates = {};
        let passCount = 0;
        list.forEach((s) => {
          let iv = parseInt(document.getElementById(`int_${s.id}`)?.value) || 0;
          let ev = parseInt(document.getElementById(`ex_${s.id}`)?.value) || 0;
          updates[
            `iat_marks/${safeKey(`iat_${num}_${yr}`)}/${safeKey(code)}/${s.id}`
          ] = {

            subjName: subj,
            staff: stf,
            internal: iv,
            exam: ev,
          };

        });

          .update(updates)

      function hodAttendanceReport() {

      function loadHODAttnReport() {
        let monthIdx = parseInt(document.getElementById("harMonth").value);
        let yr = document.getElementById("harYear").value;
        let el = document.getElementById("harContent");
        el.innerHTML = "<p>Loading...</p>";
        db.ref("attendance")
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              el.innerHTML = "<p>No data found.</p>";
              return;
            }
            let rows = [];
            let data = snap.val();
            Object.keys(data)
              .sort()
              .forEach((dk) => {
                let dateStr = dk.replace(/_/g, "-");
                let parts = dateStr.split("-");
                if (parts.length < 2) return;
                let dMonth = parseInt(parts[1]) - 1;
                if (dMonth !== monthIdx) return;
                let classData = data[dk];
                Object.keys(classData).forEach((ck) => {
                  let className = ck.replace(/_/g, " ");
                  if (yr !== "All" && safeKey(yr) !== ck) return;
                  Object.keys(classData[ck]).forEach((period) => {
                    let pd = classData[ck][period];
                    let p = 0,
                      a = 0,
                      o = 0;
                    Object.values(pd).forEach((r) => {
                      if (r.status === "Present") p++;
                      else if (r.status === "Absent") a++;
                      else o++;
                    });
                    rows.push({ date: dateStr, period, className, p, a, o });
                  });
                });
              });
            if (rows.length === 0) {
              el.innerHTML = `<p>No records found for ${MONTHS[monthIdx]}.</p>`;
              return;
            }
            let tP = rows.reduce((s, r) => s + r.p, 0),
              tA = rows.reduce((s, r) => s + r.a, 0),
              tO = rows.reduce((s, r) => s + r.o, 0);
            el.innerHTML = `<div class="table-responsive"><table>
      <thead><tr><th>Date</th><th>Period</th><th>Class</th><th>Present</th><th>Absent</th><th>OD</th></tr></thead>
      <tbody>
      ${rows.map((r) => `<tr><td>${r.date}</td><td>${r.period}</td><td style="font-size:0.8rem">${r.className}</td><td style="color:var(--secondary)">${r.p}</td><td style="color:var(--error)">${r.a}</td><td style="color:#f59e0b">${r.o}</td></tr>`).join("")}
      <tr style="font-weight:700;background:var(--bg-color)"><td colspan="3">Total</td><td style="color:var(--secondary)">${tP}</td><td style="color:var(--error)">${tA}</td><td style="color:#f59e0b">${tO}</td></tr>
      </tbody></table></div>
      <button class="btn-pdf" onclick="pdfHODAttnReport(${monthIdx},'${yr}')"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>`;
          })
          .catch(() => {
            el.innerHTML = "<p>Error loading.</p>";
          });
      }

      function saveAssignment() {
        let yr = document.getElementById("ssYr").value;
        let period = document.getElementById("ssPeriod").value;
        let code = document.getElementById("ssCode").value.trim();
        let subj = document.getElementById("ssSubj").value.trim();
        let staffLogin = document.getElementById("ssStaff").value;
        if (!code || !subj || !staffLogin) {
          alert("Fill all fields");
          return;
        }
        let staffDisp =
          STAFF_LIST.find((s) => s.login === staffLogin)?.display || staffLogin;
        db.ref(`subject_staff/${safeKey(yr)}/${period}`)
          .set({
            subjCode: code,
            subjName: subj,
            staffLogin,
            staffName: staffDisp,
          })
          .then(() => {
            alert(`Assigned: ${staffDisp} -> ${yr} ${period} (${code})`);
            loadAssignments();
          })
          .catch(() => alert("Error saving!"));
      }

        if (confirm(`Delete assignment for ${yr} - ${period}?`)) {
          db.ref(`subject_staff/${safeKey(yr)}/${period}`)
            .remove()
            .then(() => {
              alert("Deleted!");
              loadAssignments();

      function loadIATOverall() {
        let num = document.getElementById("oIATNum").value;
        let yr = document.getElementById("oIATYr").value;
        let el = document.getElementById("iatOverallContent");
        el.innerHTML = "<p>Loading...</p>";
        db.ref(`iat_marks/${safeKey(`iat_${num}_${yr}`)}`)
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              el.innerHTML = "<p>No data submitted yet.</p>";
              return;
            }
            let data = snap.val();
            let stMap = {},
              subjects = {},
              staffMap = {};
            Object.values(data).forEach((sd) =>
              Object.values(sd).forEach((r) => {
                if (!stMap[r.id]) stMap[r.id] = { name: r.name, marks: {} };
                let tot = parseInt(r.internal) + parseInt(r.exam);
                stMap[r.id].marks[r.subjCode] = {
                  tot,
                  stat: parseInt(r.exam) >= 30 && tot >= 70 ? "PASS" : "FAIL",
                  internal: r.internal,
                  exam: r.exam,
                };
                subjects[r.subjCode] = r.subjName;
                staffMap[r.subjCode] = r.staff;
              }),
            );
            let subjKeys = Object.keys(subjects);
            let html = `<div class="table-responsive"><table><thead><tr><th>ID/Name</th>${subjKeys.map((sk) => `<th>${sk}<br><small style="font-weight:400">${subjects[sk]}</small></th>`).join("")}<th style="color:var(--secondary)">Pass</th><th style="color:var(--error)">Fail</th></tr></thead><tbody>`;
            for (let sid in stMap) {
              let p = 0,
                f = 0;
              html += `<tr><td style="font-size:0.75rem">${sid}<br>${stMap[sid].name}</td>`;
              subjKeys.forEach((sk) => {
                let m = stMap[sid].marks[sk];
                if (m) {
                  if (m.stat === "PASS") p++;
                  else f++;
                  html += `<td>${m.tot}<br><span style="font-size:0.6rem;font-weight:700;color:${m.stat === "PASS" ? "var(--secondary)" : "var(--error)"}">${m.stat}</span></td>`;
                } else {
                  f++;
                  html += `<td>-</td>`;
                }
              });
              html += `<td style="font-weight:700;color:var(--secondary);text-align:center">${p}</td><td style="font-weight:700;color:var(--error);text-align:center">${f}</td></tr>`;
            }
            html += `</tbody></table></div>
      <button class="btn-pdf" onclick="pdfIATOverall('${num}','${yr}')"><i class="fa-solid fa-file-pdf"></i> Download Overall Report PDF</button>`;
            el.innerHTML = html;
          })
          .catch(() => {
            el.innerHTML = "<p>Error loading.</p>";
          });
      }

      function loadReportTable() {

            else body += "No absentees reported.";

    <h2 class="mb-3">Settings</h2>
    <div class="card">
      <div class="form-group"><label>Name</label><input type="text" class="form-control" value="${state.userName}" readonly></div>
      ${isStudent ? `<div class="form-group"><label>Register Number</label><input type="text" class="form-control" value="${state.userId}" readonly></div>` : ""}
      <div class="form-group"><label>Department</label><input type="text" class="form-control" value="CSE" readonly></div>
      ${isStudent ? `<div class="form-group"><label>Year</label><input type="text" class="form-control" value="${state.userYear}" readonly></div>` : ""}
      <div class="form-group"><label>Gmail ID</label><input type="email" id="gmailInput" class="form-control" value="${localStorage.getItem("user_gmail") || ""}" placeholder="Enter your Gmail"></div>
      <div class="flex-between mb-3 mt-3">
        <label style="font-weight:600">Dark Mode</label>
        <label class="switch"><input type="checkbox" id="themeToggle" onchange="toggleTheme()"><span class="slider"></span></label>
      </div>
      <button class="btn btn-outline" onclick="saveProfile()">Save Profile</button>
    </div>`;
        applyTheme();
      }

      function saveProfile() {
        let email = document.getElementById("gmailInput")?.value;
        if (email) {
          localStorage.setItem("user_gmail", email);
          state.email = email;
        }
        alert("Profile Saved!");
      }

      // ═══════════════════════════════════════
      // PDF FUNCTIONS
      // ═══════════════════════════════════════
      function pdfHeader(doc, title, subtitle) {
        doc.setFontSize(13);
        doc.setFont(undefined, "bold");
        doc.text(COLLEGE, 14, 12);
        doc.setFontSize(8);
        doc.setFont(undefined, "normal");
        doc.text(COLLEGE_ADDR, 14, 18);
        doc.setFontSize(10);
        doc.setFont(undefined, "bold");
        doc.text(title, 14, 25);
        if (subtitle) {
          doc.setFontSize(8);
          doc.setFont(undefined, "normal");
          doc.text(subtitle, 14, 31);
        }
        doc.setFontSize(8);
        doc.text(
          `Generated: ${new Date().toLocaleDateString()}`,
          14,
          subtitle ? 37 : 31,
        );
        return subtitle ? 41 : 35;
      }

      function pdfTimetable(yr) {
        db.ref(`timetables/${safeKey(yr)}`)
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              alert("No timetable data!");
              return;
            }
            let tt = snap.val();
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "landscape" });
            let y = pdfHeader(doc, `Timetable - ${yr}`, `CSE Department`);
            let days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            let rows = days.map((d) => {
              let row = [d];
              PERIODS.forEach((p, i) => {
                let c = tt[`${d}_${i + 1}`] || { subj: "", staff: "" };
                row.push(
                  `${c.subj}\n${c.staff ? getStaffDisplay(c.staff) : ""}`,
                );
              });
              return row;
            });
            doc.autoTable({
              head: [["Day", ...PERIODS]],
              body: rows,
              startY: y,
              styles: { fontSize: 7, cellPadding: 2 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              alternateRowStyles: { fillColor: [243, 244, 246] },
            });
            doc.save(`Timetable_${yr.replace(/ /g, "_")}.pdf`);
          });
      }

      function pdfStudentIAT(num, yr, studentId, studentName) {
        db.ref(`iat_marks/${safeKey(`iat_${num}_${yr}`)}`)
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              alert("No data!");
              return;
            }
            let marks = [];
            Object.values(snap.val()).forEach((sd) =>
              Object.values(sd).forEach((r) => {
                if (r.id === studentId) marks.push(r);
              }),
            );
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = pdfHeader(
              doc,
              `IAT-${num} Results`,
              `Student: ${studentName} (${studentId}) | ${yr} | CSE`,
            );
            doc.autoTable({
              head: [
                [
                  "Subject Code",
                  "Subject Name",
                  "Internal",
                  "Exam",
                  "Total",
                  "Status",
                ],
              ],
              body: marks.map((m) => {
                let tot = parseInt(m.internal) + parseInt(m.exam);
                return [
                  m.subjCode,
                  m.subjName,
                  m.internal,
                  m.exam,
                  tot,
                  m.exam >= 30 && tot >= 70 ? "PASS" : "FAIL",
                ];
              }),
              startY: y,
              styles: { fontSize: 9 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              didParseCell(d) {
                if (d.section === "body" && d.column.index === 5) {
                  d.cell.styles.textColor =
                    d.cell.raw === "PASS" ? [16, 185, 129] : [239, 68, 68];
                  d.cell.styles.fontStyle = "bold";
                }
              },
            });
            doc.save(`IAT${num}_${studentName.replace(/ /g, "_")}.pdf`);
          });
      }

      function pdfSubjectReport(num, yr, code, subj, stf) {
        db.ref(`iat_marks/${safeKey(`iat_${num}_${yr}`)}/${safeKey(code)}`)
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              alert("Submit marks first!");
              return;
            }
            let data = Object.values(snap.val());
            let total = data.length;
            let passed = data.filter(
              (s) =>
                parseInt(s.exam) >= 30 &&
                parseInt(s.internal) + parseInt(s.exam) >= 70,
            ).length;
            let failed = total - passed;
            let passPerc = ((passed / total) * 100).toFixed(1);
            let failPerc = ((failed / total) * 100).toFixed(1);
            let totals = data.map(
              (s) => parseInt(s.internal) + parseInt(s.exam),
            );
            let highest = Math.max(...totals);
            let lowest = Math.min(...totals);
            let ranges = [
              [0, 9],
              [10, 19],
              [20, 29],
              [30, 39],
              [40, 49],
              [50, 59],
              [60, 69],
              [70, 79],
              [80, 89],
              [90, 100],
            ];
            let rangeCounts = ranges.map(
              ([mn, mx]) =>
                data.filter((s) => {
                  let t = parseInt(s.internal) + parseInt(s.exam);
                  return t >= mn && t <= mx;
                }).length,
            );
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let staffDisp =
              STAFF_LIST.find((s) => s.login === stf)?.display ||
              stf.toUpperCase();
            let y = pdfHeader(
              doc,
              `IAT-${num} Subject Report`,
              `Subject: ${subj} (${code}) | Class: ${yr} | CSE`,
            );
            doc.setFontSize(8);
            doc.text(`Staff Incharge: ${staffDisp}`, 14, y);
            y += 6;
            doc.autoTable({
              head: [
                [
                  "Reg No",
                  "Student Name",
                  "Internal (40)",
                  "Exam (60)",
                  "Total (100)",
                  "Status",
                ],
              ],
              body: data.map((s) => {
                let tot = parseInt(s.internal) + parseInt(s.exam);
                return [
                  s.id,
                  s.name,
                  s.internal,
                  s.exam,
                  tot,
                  s.exam >= 30 && tot >= 70 ? "PASS" : "FAIL",
                ];
              }),
              startY: y,
              styles: { fontSize: 8 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              didParseCell(d) {
                if (d.section === "body" && d.column.index === 5) {
                  d.cell.styles.textColor =
                    d.cell.raw === "PASS" ? [16, 185, 129] : [239, 68, 68];
                  d.cell.styles.fontStyle = "bold";
                }
              },
            });
            y = doc.lastAutoTable.finalY + 8;
            doc.setFontSize(11);
            doc.setFont(undefined, "bold");
            doc.text("ANALYSIS:", 14, y);
            y += 5;
            doc.autoTable({
              head: [
                [
                  "% of Mark",
                  "0-09",
                  "10-19",
                  "20-29",
                  "30-39",
                  "40-49",
                  "50-59",
                  "60-69",
                  "70-79",
                  "80-89",
                  "90-100",
                ],
              ],
              body: [["No. of Students", ...rangeCounts]],
              startY: y,
              styles: { fontSize: 8, halign: "center" },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
            });
            y = doc.lastAutoTable.finalY + 6;
            doc.setFontSize(9);
            doc.setFont(undefined, "normal");
            doc.text(`Number of students passed in subject:  ${passed}`, 14, y);
            y += 5;
            doc.text(
              `Overall pass%:  ${passPerc}%           Overall fail%:  ${failPerc}%`,
              14,
              y,
            );
            y += 7;
            doc.text(`Highest mark:  ${highest}`, 14, y);
            doc.text(`Lowest mark:  ${lowest}`, 110, y);
            y += 10;
            doc.setFont(undefined, "bold");
            doc.text("Reason for failure:", 14, y);
            y += 5;
            doc.setFont(undefined, "normal");
            doc.text(
              "1.  Failed students not attend Part A & B Questions Properly",
              14,
              y,
            );
            y += 14;
            doc.setFont(undefined, "bold");
            doc.text("Staff Incharge", 14, y);
            doc.text("HoD / CSE", 90, y);
            doc.text("Principal", 170, y);
            doc.save(`IAT${num}_Subject_${code}.pdf`);
          });
      }

      function pdfStaffAttnReport(monthIdx, yr) {
        db.ref("attendance")
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              alert("No data!");
              return;
            }
            let rows = [];
            let data = snap.val();
            Object.keys(data)
              .sort()
              .forEach((dk) => {
                let dateStr = dk.replace(/_/g, "-");
                let dMonth = parseInt(dateStr.split("-")[1]) - 1;
                if (dMonth !== monthIdx) return;
                let classData = data[dk][safeKey(yr)];
                if (!classData) return;
                Object.keys(classData).forEach((period) => {
                  let pd = classData[period];
                  let hasStaff = Object.values(pd).some(
                    (r) => r.staffLogin === state.userId,
                  );
                  if (!hasStaff) return;
                  let p = 0,
                    a = 0,
                    o = 0;
                  Object.values(pd).forEach((r) => {
                    if (r.status === "Present") p++;
                    else if (r.status === "Absent") a++;
                    else o++;
                  });
                  let first = Object.values(pd)[0];
                  rows.push({
                    date: dateStr,
                    period,
                    subjCode: first?.subjCode || "",
                    subjName: first?.subjName || "",
                    p,
                    a,
                    o,
                  });
                });
              });
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = pdfHeader(
              doc,
              `Attendance Report - ${MONTHS[monthIdx]}`,
              `Staff: ${state.userName} | Class: ${yr} | CSE`,
            );
            let tP = rows.reduce((s, r) => s + r.p, 0),
              tA = rows.reduce((s, r) => s + r.a, 0),
              tO = rows.reduce((s, r) => s + r.o, 0);
            doc.autoTable({
              head: [["Date", "Period", "Subject", "Present", "Absent", "OD"]],
              body: [
                ...rows.map((r) => [
                  r.date,
                  r.period,
                  `${r.subjCode} ${r.subjName}`,
                  r.p,
                  r.a,
                  r.o,
                ]),
                ["Total", "", "", tP, tA, tO],
              ],
              startY: y,
              styles: { fontSize: 8 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              alternateRowStyles: { fillColor: [243, 244, 246] },
            });
            doc.save(
              `AttendanceReport_${MONTHS[monthIdx]}_${state.userName.replace(/ /g, "_")}.pdf`,
            );
          });
      }

      function pdfHODAttnReport(monthIdx, yr) {
        db.ref("attendance")
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              alert("No data!");
              return;
            }
            let rows = [];
            let data = snap.val();
            Object.keys(data)
              .sort()
              .forEach((dk) => {
                let dateStr = dk.replace(/_/g, "-");
                let dMonth = parseInt(dateStr.split("-")[1]) - 1;
                if (dMonth !== monthIdx) return;
                Object.keys(data[dk]).forEach((ck) => {
                  let className = ck.replace(/_/g, " ");
                  if (yr !== "All" && safeKey(yr) !== ck) return;
                  Object.keys(data[dk][ck]).forEach((period) => {
                    let pd = data[dk][ck][period];
                    let p = 0,
                      a = 0,
                      o = 0;
                    Object.values(pd).forEach((r) => {
                      if (r.status === "Present") p++;
                      else if (r.status === "Absent") a++;
                      else o++;
                    });
                    rows.push({ date: dateStr, period, className, p, a, o });
                  });
                });
              });
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "landscape" });
            let y = pdfHeader(
              doc,
              `Attendance Report - ${MONTHS[monthIdx]}`,
              `Class: ${yr} | CSE Department`,
            );
            let tP = rows.reduce((s, r) => s + r.p, 0),
              tA = rows.reduce((s, r) => s + r.a, 0),
              tO = rows.reduce((s, r) => s + r.o, 0);
            doc.autoTable({
              head: [["Date", "Period", "Class", "Present", "Absent", "OD"]],
              body: [
                ...rows.map((r) => [
                  r.date,
                  r.period,
                  r.className,
                  r.p,
                  r.a,
                  r.o,
                ]),
                ["Total", "", "", tP, tA, tO],
              ],
              startY: y,
              styles: { fontSize: 8 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              alternateRowStyles: { fillColor: [243, 244, 246] },
            });
            doc.save(`HOD_AttendanceReport_${MONTHS[monthIdx]}.pdf`);
          });
      }

      function pdfIATOverall(num, yr) {
        db.ref(`iat_marks/${safeKey(`iat_${num}_${yr}`)}`)
          .once("value")
          .then((snap) => {
            if (!snap.exists()) {
              alert("No data!");
              return;
            }
            let data = snap.val();
            let stMap = {},
              subjects = {},
              staffMap = {};
            Object.values(data).forEach((sd) =>
              Object.values(sd).forEach((r) => {
                if (!stMap[r.id]) stMap[r.id] = { name: r.name, marks: {} };
                let tot = parseInt(r.internal) + parseInt(r.exam);
                stMap[r.id].marks[r.subjCode] = {
                  tot,
                  stat: parseInt(r.exam) >= 30 && tot >= 70 ? "PASS" : "FAIL",
                  internal: r.internal,
                  exam: r.exam,
                };
                subjects[r.subjCode] = r.subjName;
                staffMap[r.subjCode] = r.staff;
              }),
            );
            let subjKeys = Object.keys(subjects);
            let totalStudents = Object.keys(stMap).length;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: "landscape" });
            let y = pdfHeader(
              doc,
              `IAT-${num} Overall Report`,
              `${yr} | CSE Department`,
            );
            let headers = [
              [
                "S.No",
                "Reg No",
                "Name",
                ...subjKeys.map((sk, i) => `${i + 1}.${sk}`),
                "Pass",
                "Fail",
              ],
            ];
            let rows = [];
            let sno = 1;
            for (let sid in stMap) {
              let p = 0,
                f = 0;
              let row = [sno++, sid, stMap[sid].name];
              subjKeys.forEach((sk) => {
                let m = stMap[sid].marks[sk];
                if (m) {
                  if (m.stat === "PASS") p++;
                  else f++;
                  row.push(`${m.tot}(${m.stat})`);
                } else {
                  f++;
                  row.push("-");
                }
              });
              row.push(p, f);
              rows.push(row);
            }
            doc.autoTable({
              head: headers,
              body: rows,
              startY: y,
              styles: { fontSize: 6, cellPadding: 1.5 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              alternateRowStyles: { fillColor: [243, 244, 246] },
            });
            y = doc.lastAutoTable.finalY + 8;
            doc.setFontSize(11);
            doc.setFont(undefined, "bold");
            doc.text("SUBJECT WISE ANALYSIS:", 14, y);
            y += 5;
            let subjHead = [
              [
                "S.No",
                "Code & Name",
                "Staff",
                "No.of Students\nAttended",
                "No.of Students\nPassed",
                "Pass\nPercentage",
                "Reason for Failure",
              ],
            ];
            let subjRows = subjKeys.map((sk, idx) => {
              let attended = Object.values(stMap).filter(
                (s) => s.marks[sk],
              ).length;
              let passed = Object.values(stMap).filter(
                (s) => s.marks[sk] && s.marks[sk].stat === "PASS",
              ).length;
              let perc =
                attended > 0
                  ? ((passed / attended) * 100).toFixed(0) + "%"
                  : "0%";
              let staffDisp =
                STAFF_LIST.find((s) => s.login === staffMap[sk])?.display ||
                staffMap[sk] ||
                "";
              return [
                idx + 1,
                `${sk}\n${subjects[sk]}`,
                staffDisp,
                attended,
                passed,
                perc,
                "Failed students not attend Part A & B Questions Properly",
              ];
            });
            doc.autoTable({
              head: subjHead,
              body: subjRows,
              startY: y,
              styles: { fontSize: 7, cellPadding: 2 },
              headStyles: { fillColor: [79, 70, 229], textColor: 255 },
              alternateRowStyles: { fillColor: [243, 244, 246] },
            });
            y = doc.lastAutoTable.finalY + 7;
            let totalPassed = Object.values(stMap).filter((s) =>
              subjKeys.every(
                (sk) => s.marks[sk] && s.marks[sk].stat === "PASS",
              ),
            ).length;
            let overallPerc =
              totalStudents > 0
                ? ((totalPassed / totalStudents) * 100).toFixed(1)
                : "0";
            doc.setFontSize(9);
            doc.setFont(undefined, "bold");
            doc.text(
              `No. of Students passed in all subjects:  ${totalPassed}`,
              14,
              y,
            );
            y += 5;
            doc.text(`OVERALL PASS PERCENTAGE:  ${overallPerc}%`, 14, y);
            y += 12;
            doc.setFontSize(10);
            doc.text("CLASS ADVISOR", 14, y);
            doc.text("HoD / CSE", 110, y);
            doc.text("PRINCIPAL", 200, y);
            doc.save(`IAT${num}_Overall_${yr.replace(/ /g, "_")}.pdf`);
          });
      }

      // ═══════════════════════════════════════
      // INIT
      // ═══════════════════════════════════════
      window.onload = function () {
        applyTheme();
        setTimeout(() => {
          document.getElementById("splash").classList.add("hidden");
          let saved = localStorage.getItem("mpnmjec_user");
          if (saved) {
            state = JSON.parse(saved);
            loadApp();
          } else {
            document.getElementById("loginPage").classList.remove("hidden");
          }
        }, 2000);
      };
    </script>
